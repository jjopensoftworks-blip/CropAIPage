<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="50%" stop-color="#091812" />
      <stop offset="100%" stop-color="#040907" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed573" />
      <stop offset="50%" stop-color="#10ac84" />
      <stop offset="100%" stop-color="#05c46b" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#54a0ff" />
    </linearGradient>

    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd59" />
      <stop offset="100%" stop-color="#ff9f43" />
    </linearGradient>

    <linearGradient id="glass-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2ed573" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg-grad)" stroke="url(#neon-green)" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#glass-overlay)"/>

  <!-- Glowing Outer Tech Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyber-cyan)" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#neon-green)" stroke-width="1.5" opacity="0.25"/>

  <!-- Scanning Reticle Corners -->
  <path d="M105 155 V 105 H 155" stroke="url(#cyber-cyan)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#neon-glow)"/>
  <path d="M407 155 V 105 H 357" stroke="url(#cyber-cyan)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#neon-glow)"/>
  <path d="M105 357 V 407 H 155" stroke="url(#cyber-cyan)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#neon-glow)"/>
  <path d="M407 357 V 407 H 357" stroke="url(#cyber-cyan)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#neon-glow)"/>

  <!-- Scanning Laser Horizon -->
  <line x1="85" y1="256" x2="427" y2="256" stroke="url(#neon-green)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Central Glass Shield -->
  <circle cx="256" cy="256" r="140" fill="rgba(9, 24, 18, 0.75)" stroke="url(#neon-green)" stroke-width="4" filter="url(#drop-shadow)"/>

  <!-- Main AI Leaf & Sprout Glyph -->
  <g filter="url(#neon-glow)">
    <!-- Primary Left Leaf -->
    <path d="M256 140 C170 180 150 280 256 340 C220 270 210 200 256 140 Z" fill="url(#neon-green)"/>
    <!-- Secondary Right Leaf -->
    <path d="M256 160 C340 190 350 290 256 340 C300 280 300 210 256 160 Z" fill="url(#cyber-cyan)" opacity="0.9"/>
    <!-- Center Leaf Vein Line -->
    <path d="M256 140 V 355" stroke="#06120b" stroke-width="5" stroke-linecap="round"/>
    <path d="M256 220 C225 200 200 210 185 225" stroke="#06120b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M256 200 C285 180 310 190 325 205" stroke="#06120b" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- GPS Target Beacon Dot -->
  <circle cx="256" cy="140" r="12" fill="url(#gold-amber)" filter="url(#neon-glow)"/>
  <circle cx="256" cy="140" r="6" fill="#ffffff"/>
</svg>
