<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f241a" />
      <stop offset="100%" stop-color="#060e0a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed573" />
      <stop offset="100%" stop-color="#10ac84" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#2ed573" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2ed573" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="8"/>
  
  <!-- Reticle Scanning Elements -->
  <path d="M120 180 V 140 H 160" stroke="#00d2d3" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M392 180 V 140 H 352" stroke="#00d2d3" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M120 332 V 372 H 160" stroke="#00d2d3" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M392 332 V 372 H 352" stroke="#00d2d3" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Central Glowing Leaf Plant Symbol -->
  <g filter="url(#shadow)" transform="translate(156, 140)">
    <!-- Main Leaf -->
    <path d="M100 20 C140 60 180 140 100 220 C20 140 60 60 100 20 Z" fill="url(#accent-grad)"/>
    <!-- Leaf Stem Line -->
    <path d="M100 20 V 220" stroke="#090e0c" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Leaf Branch -->
    <path d="M100 120 C70 100 40 110 30 130" stroke="#090e0c" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Right Leaf Branch -->
    <path d="M100 90 C130 70 160 80 170 100" stroke="#090e0c" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Soil Waves -->
    <path d="M20 220 Q 60 200 100 220 T 180 220" stroke="url(#glow-grad)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
